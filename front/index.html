<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好棒棒點餐</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .main-layout {
            display: flex;
            gap: 20px;
        }
        .user-shops-sidebar {
            width: 230px;
            flex-shrink: 0;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #e9ecef;
            height: fit-content;
        }
        .shops-header {
            font-size: 15px;
            font-weight: 700;
            color: #333;
            padding-bottom: 8px;
            margin-bottom: 12px;
            border-bottom: 2px solid #667eea;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-shops-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .shop-card {
            background: white;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .shop-card:hover {
            border-color: #667eea;
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.12);
        }
        .shop-card.active {
            border-color: #667eea;
            background: #f0f4ff;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.25);
        }
        .shop-edit-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: #edf2f7;
            padding: 10px 15px;
            border-radius: 8px;
        }
        .edit-btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-add {
            background: #3182ce;
            color: white;
        }
        .btn-add:hover {
            background: #2b6cb0;
        }
        .btn-save {
            background: #38a169;
            color: white;
        }
        .btn-save:hover {
            background: #2f855a;
        }
        .edit-item-row {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .edit-input-name {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
        }
        .edit-input-price {
            width: 90px;
            padding: 8px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn-delete-item {
            background: #e53e3e;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }
        .btn-delete-item:hover {
            background: #c53030;
        }
        .btn-delete-shop {
            background: transparent;
            border: none;
            color: #a0aec0;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .btn-delete-shop:hover {
            color: #e53e3e;
            background: #fff5f5;
        }
        .edit-shop-name-title-input {
            font-size: 14px;
            font-weight: 700;
            color: #2d3748;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            padding: 4px 8px;
            width: 140px;
        }
        .shop-card-name {
            font-size: 13px;
            font-weight: 600;
            color: #2d3748;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 140px;
        }
        .shop-card-count {
            font-size: 11px;
            color: #4a5568;
            background: #edf2f7;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 500;
        }
        .no-shops-msg {
            font-size: 12px;
            color: #718096;
            text-align: center;
            padding: 15px 5px;
            line-height: 1.6;
        }
        .menu-main-area {
            flex: 1;
            min-width: 0;
        }
        @media (max-width: 650px) {
            .main-layout {
                flex-direction: column;
            }
            .user-shops-sidebar {
                width: 100%;
            }
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .title:hover {
            transform: scale(1.04);
            opacity: 0.92;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.2);
            padding: 8px 12px;
            border-radius: 20px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid white;
        }
        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .user-name {
            font-size: 14px;
            font-weight: 600;
        }
        .content {
            padding: 30px 20px;
        }
        .menu-section {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .menu-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .menu-list {
            list-style: none;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }
        .menu-item:last-child {
            border-bottom: none;
        }
        .item-name {
            font-weight: 500;
            color: #333;
        }
        .item-price {
            font-weight: 600;
            color: #06C755;
            font-size: 16px;
        }
        .json-preview {
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            margin-top: 20px;
            overflow-x: auto;
        }
        .json-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .json-code {
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            color: #333;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
            border: 1px solid #fcc;
        }
        .menu-item-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .menu-item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 4px 8px;
        }
        .quantity-btn {
            background: none;
            border: none;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
            font-weight: bold;
            transition: all 0.2s;
        }
        .quantity-btn:hover {
            background: #f0f0f0;
            border-radius: 4px;
        }
        .quantity-btn:disabled {
            color: #ccc;
            cursor: not-allowed;
        }
        .quantity-display {
            min-width: 30px;
            text-align: center;
            font-weight: 600;
            color: #333;
        }
        .cart-section {
            background: #f9f9f9;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }
        .cart-section.show {
            display: block;
        }
        .cart-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cart-items-list {
            list-style: none;
            margin-bottom: 15px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: white;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #eee;
        }
        .cart-item-info {
            flex: 1;
        }
        .cart-item-name {
            font-weight: 500;
            color: #333;
        }
        .cart-item-qty {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }
        .cart-item-price {
            font-weight: 600;
            color: #06C755;
            min-width: 60px;
            text-align: right;
        }
        .cart-item-remove {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
        }
        .cart-item-remove:hover {
            background: #ff5252;
        }
        .cart-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10px;
            background: #f5f5f5;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .cart-summary-label {
            font-weight: 600;
            color: #333;
        }
        .cart-summary-total {
            font-size: 20px;
            font-weight: 700;
            color: #06C755;
        }
        .submit-btn {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .empty-cart-msg {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
        .cart-icon-btn {
            position: fixed;
            bottom: 25px;
            left: 25px;
            z-index: 999;
            background: #ffffff;
            color: #1e293b;
            border: 2px solid #e2e8f0;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cart-icon-btn:hover {
            transform: scale(1.1);
            background: #f8fafc;
            border-color: #cbd5e1;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22);
        }
        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ff4757;
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 16px 16px 0 0;
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        .modal-close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        .modal-close-btn:hover {
            color: #333;
        }
        .btn-close-order {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(229, 62, 62, 0.3);
            transition: all 0.2s ease;
        }
        .btn-close-order:hover {
            background: #c53030;
            transform: translateY(-1px);
        }
        .closed-banner {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.5;
        }
        .closed-banner.success {
            background: #e6fffa;
            border: 1px solid #b2f5ea;
            color: #234e52;
        }
        .closed-banner.danger {
            background: #fff5f5;
            border: 1px solid #fed7d7;
            color: #9b2c2c;
            text-align: center;
        }
        .my-order-summary-card {
            background: #f7fafc;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .my-order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 10px;
        }
        .my-order-list {
            list-style: none;
            margin-bottom: 10px;
        }
        .my-order-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 14px;
            color: #4a5568;
            border-bottom: 1px dashed #edf2f7;
        }
        .my-order-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 15px;
            color: #2d3748;
            padding-top: 8px;
        }
        /* ===== 歷史訂單按鈕 ===== */
        .btn-history {
            background: rgba(255,255,255,0.18);
            color: white;
            border: 1.5px solid rgba(255,255,255,0.45);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-history:hover {
            background: rgba(255,255,255,0.32);
            border-color: white;
        }
        /* ===== 歷史訂單 Modal ===== */
        .history-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1100;
            justify-content: center;
            align-items: flex-end;
        }
        .history-overlay.show {
            display: flex;
        }
        .history-modal {
            background: white;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px;
            animation: slideUp 0.3s ease-out;
        }
        .history-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 2px solid #f0f0f0;
        }
        .history-modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #2d3748;
        }
        .history-empty {
            text-align: center;
            color: #a0aec0;
            padding: 40px 20px;
            font-size: 14px;
        }
        .history-card {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            transition: box-shadow 0.2s;
        }
        .history-card:hover {
            box-shadow: 0 4px 12px rgba(102,126,234,0.13);
        }
        .history-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .history-shop-name {
            font-size: 15px;
            font-weight: 700;
            color: #2d3748;
        }
        .history-total {
            font-size: 16px;
            font-weight: 700;
            color: #e53e3e;
        }
        .history-meta {
            font-size: 12px;
            color: #718096;
            margin-bottom: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .history-meta span {
            background: #edf2f7;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .history-items {
            list-style: none;
            border-top: 1px dashed #e2e8f0;
            padding-top: 8px;
            margin-top: 4px;
        }
        .history-item-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #4a5568;
            padding: 3px 0;
        }
        .history-loading {
            text-align: center;
            padding: 30px;
            color: #667eea;
            font-size: 14px;
        }
        .btn-delete-history {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 4px;
            border-radius: 6px;
            opacity: 0.55;
            transition: opacity 0.2s, transform 0.15s;
            line-height: 1;
        }
        .btn-delete-history:hover {
            opacity: 1;
            transform: scale(1.15);
        }
        .badge-completed {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: linear-gradient(135deg, #38a169, #48bb78);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 12px;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title" onclick="goHomeOrderingView()" title="回到點餐介面">🍔 好棒棒點餐</div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="cart-icon-btn" id="cartIconBtn">
                    🛒
                    <span class="cart-badge" id="cartBadge" style="display: none;">0</span>
                </button>
                <button class="btn-history" id="historyBtn" onclick="openHistory()" style="display:none;">
                    📜 歷史訂單
                </button>
                <div class="user-info">
                    <div class="user-avatar">
                        <img id="userAvatar" src="" alt="用户頭像">
                    </div>
                    <div class="user-name" id="userName">加載中...</div>
                </div>
            </div>
        </div>
        <div class="content">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>辨識菜單中...</p>
            </div>
            
            <div class="main-layout">
                <!-- 左側：個人專屬店家庫 -->
                <div class="user-shops-sidebar" id="userShopsSidebar">
                    <div class="shops-header">
                        <span>🏪 我的店家庫</span>
                    </div>
                    <div id="userShopsList" class="user-shops-list">
                        <div class="no-shops-msg">載入中...</div>
                    </div>
                </div>

                <!-- 右側：主要菜單點餐區域 -->
                <div class="menu-main-area">
                    <div id="menuContent" style="display: none;">
                        <div class="menu-section">
                            <div class="menu-title">📋 菜單</div>
                            <div id="closedStatusBanner" class="closed-banner" style="display: none;"></div>
                            <div id="myOrderSummaryCard" class="my-order-summary-card" style="display: none;"></div>
                            <div id="shopNameDisplay" style="margin-bottom: 12px; font-size: 16px; font-weight: 600; color: #444;"></div>
                            <ul class="menu-list" id="menuList">
                            </ul>
                        </div>
                    </div>
                    
                    <div id="errorContent" style="display: none;">
                    </div>
                </div>
            </div>
            
            <!-- 歷史訂單 Modal -->
            <div class="history-overlay" id="historyModal">
                <div class="history-modal">
                    <div class="history-modal-header">
                        <div class="history-modal-title">📜 我的歷史訂單</div>
                        <button class="modal-close-btn" onclick="closeHistory()">✕</button>
                    </div>
                    <div id="historyContent"><div class="history-loading">載入中...</div></div>
                </div>
            </div>

            <!-- 購物車 Modal -->
            <div class="modal-overlay" id="cartModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <div class="modal-title">🛒 購物車</div>
                        <button class="modal-close-btn" id="cartCloseBtn">✕</button>
                    </div>
                    <ul class="cart-items-list" id="cartItemsList"></ul>
                    <div class="empty-cart-msg" id="emptyCartMsg">購物車是空的，請選擇餐點</div>
                    <div id="cartSummaryDiv" style="display: none;">
                        <div class="cart-summary">
                            <span class="cart-summary-label">總計：</span>
                            <span class="cart-summary-total" id="cartTotal">$0</span>
                        </div>
                        <button class="submit-btn" id="submitOrderBtn">📤 送出訂單</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 購物車數據儲存
        let cart = {};
        let menuDataGlobal = [];
        let userIdGlobal = '';
        let userNameGlobal = '';  // LINE 用戶名
        let groupIdGlobal = '';
        let sessionIdGlobal = '';
        let shopNameGlobal = '';
        let hasSubmittedOrder = false;  // 是否已送出訂單
        let currentOrder = null;  // 當前訂單
        let isSessionClosedGlobal = false; // 是否已結單
        let initiatorIdGlobal = ''; // 團購發起人 ID
        
        // ===== 歷史訂單 =====
        function openHistory() {
            const modal = document.getElementById('historyModal');
            modal.classList.add('show');
            loadHistory();
        }

        function closeHistory() {
            document.getElementById('historyModal').classList.remove('show');
        }

        async function loadHistory() {
            const container = document.getElementById('historyContent');
            if (!userIdGlobal) {
                container.innerHTML = '<div class="history-empty">⚠️ 無法取得用戶資訊，請重新整理</div>';
                return;
            }
            container.innerHTML = '<div class="history-loading">⏳ 載入中...</div>';
            try {
                const res = await fetch(`/api/order-history/${userIdGlobal}`);
                const data = await res.json();
                const history = data.history || [];
                if (history.length === 0) {
                    container.innerHTML = '<div class="history-empty">📭 目前還沒有歷史訂單紀錄<br><small>完成一次團購後即會顯示</small></div>';
                    return;
                }
                let html = '';
                history.forEach(record => {
                    const shopName = record.shop_name || '未知店家';
                    const total = record.total || 0;
                    const groupTotal = record.group_total || 0;
                    const initiator = record.initiator_name || '發起人';
                    const groupName = record.group_name || '';
                    const groupId = record.group_id ? record.group_id.slice(-6) : '';
                    const groupDisplay = groupName || (groupId ? `...${groupId}` : '');
                    const items = Array.isArray(record.items) ? record.items : [];
                    let timeStr = '';
                    if (record.completed_at) {
                        try {
                            const d = new Date(record.completed_at);
                            timeStr = d.toLocaleString('zh-TW', {
                                year: 'numeric', month: '2-digit', day: '2-digit',
                                hour: '2-digit', minute: '2-digit'
                            });
                        } catch(e) { timeStr = record.completed_at; }
                    }
                    const itemsHtml = items.map(it => {
                        const name = it.item || it.item_name || it.name || '餐點';
                        const qty = it.quantity || it.qty || 1;
                        const price = it.price || 0;
                        return `<li class="history-item-row">
                            <span>${name} × ${qty}</span>
                            <span>$${price * qty}</span>
                        </li>`;
                    }).join('');

                    const docId = record.doc_id || '';
                    html += `
                    <div class="history-card" id="hcard-${docId}">
                        <div class="history-card-header">
                            <div class="history-shop-name">🏪 ${shopName}</div>
                            <div style="display:flex;align-items:center;gap:8px;">
                                <div class="history-total">$${total}</div>
                                ${docId ? `<button class="btn-delete-history" onclick="deleteHistoryRecord('${docId}')" title="移除此紀錄">🗑️</button>` : ''}
                            </div>
                        </div>
                        <div class="history-meta">
                            <span>👑 ${initiator}</span>
                            ${groupDisplay ? `<span>📍 ${groupDisplay}</span>` : ''}
                            ${timeStr ? `<span>🕒 ${timeStr}</span>` : ''}
                        </div>
                        <ul class="history-items">${itemsHtml || '<li class="history-item-row"><span>（無餐點明細）</span></li>'}</ul>
                    </div>`;
                });
                container.innerHTML = html;
            } catch(err) {
                console.error('載入歷史訂單失敗:', err);
                container.innerHTML = '<div class="history-empty">❌ 載入失敗，請稍後再試</div>';
            }
        }

        // 刪除單筆歷史訂單
        async function deleteHistoryRecord(docId) {
            if (!confirm('確定要移除這筆歷史訂單紀錄嗎？')) return;
            try {
                const res = await fetch(`/api/order-history/${userIdGlobal}/${docId}`, { method: 'DELETE' });
                if (res.ok) {
                    const el = document.getElementById(`hcard-${docId}`);
                    if (el) {
                        el.style.transition = 'opacity 0.3s';
                        el.style.opacity = '0';
                        setTimeout(() => el.remove(), 300);
                    }
                } else {
                    alert('❌ 刪除失敗，請稍後再試');
                }
            } catch(err) {
                console.error('刪除歷史訂單失敗:', err);
                alert('❌ 刪除失敗');
            }
        }

        // 點擊背景關閉歷史 Modal
        document.getElementById('historyModal').addEventListener('click', function(e) {
            if (e.target === this) closeHistory();
        });

        function addToCart(itemName, itemPrice) {
            if (cart[itemName]) {
                cart[itemName].quantity++;
            } else {
                cart[itemName] = {
                    price: itemPrice,
                    quantity: 1
                };
            }
            updateCartDisplay();
        }
        
        function removeFromCart(itemName) {
            if (isSessionClosedGlobal) {
                alert('🔒 本次團購已結單，無法移除購物車餐點');
                return;
            }
            delete cart[itemName];
            updateCartDisplay();
        }
        
        function updateQuantity(itemName, delta) {
            if (isSessionClosedGlobal) {
                alert('🔒 本次團購已結單，無法調整點餐數量');
                return;
            }
            if (!cart[itemName]) {
                const itemPrice = menuDataGlobal.find(item => {
                    const name = item.item_name || item.name || item.品項名稱;
                    return name === itemName;
                })?.price || 0;
                
                if (delta > 0) {
                    cart[itemName] = {
                        price: itemPrice,
                        quantity: delta
                    };
                }
            } else {
                cart[itemName].quantity += delta;
                if (cart[itemName].quantity <= 0) {
                    delete cart[itemName];
                }
            }
            updateCartDisplay();
        }
        
        function updateCartDisplay() {
            const cartItemsList = document.getElementById('cartItemsList');
            const emptyCartMsg = document.getElementById('emptyCartMsg');
            const cartSummaryDiv = document.getElementById('cartSummaryDiv');
            const cartBadge = document.getElementById('cartBadge');
            const submitBtn = document.getElementById('submitOrderBtn');
            
            const qtyElements = document.querySelectorAll('.quantity-display');
            qtyElements.forEach(element => {
                const itemName = element.getAttribute('data-item-name');
                element.textContent = cart[itemName]?.quantity || 0;
            });
            
            cartItemsList.innerHTML = '';
            let total = 0;
            let itemCount = 0;
            
            for (const [itemName, itemData] of Object.entries(cart)) {
                itemCount++;
                const subtotal = itemData.price * itemData.quantity;
                total += subtotal;
                
                const li = document.createElement('li');
                li.className = 'cart-item';
                const safeName = itemName.replace(/'/g, "\\'");
                const removeBtnAttr = isSessionClosedGlobal ? 'disabled style="background:#ccc;cursor:not-allowed;"' : '';
                li.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-name">${itemName}</div>
                        <div class="cart-item-qty">$${itemData.price} × ${itemData.quantity}</div>
                    </div>
                    <div class="cart-item-price">$${subtotal}</div>
                    <button class="cart-item-remove" data-item-name="${itemName}" ${removeBtnAttr} onclick="removeFromCart('${safeName}')">移除</button>
                `;
                cartItemsList.appendChild(li);
            }
            
            if (itemCount === 0) {
                emptyCartMsg.style.display = 'block';
                cartSummaryDiv.style.display = 'none';
                cartBadge.style.display = 'none';
            } else {
                emptyCartMsg.style.display = 'none';
                cartSummaryDiv.style.display = 'block';
                document.getElementById('cartTotal').textContent = '$' + total;
                cartBadge.textContent = itemCount;
                cartBadge.style.display = 'flex';
            }

            if (submitBtn) {
                submitBtn.onclick = submitOrder;
                if (isSessionClosedGlobal) {
                    submitBtn.disabled = true;
                    submitBtn.textContent = hasSubmittedOrder ? '🔒 已結單無法修改' : '🔒 已結單無法點餐';
                } else {
                    submitBtn.disabled = false;
                    submitBtn.textContent = hasSubmittedOrder ? '📤 更新訂單' : '📤 送出訂單';
                }
            }
        }
        
        // 顯示並自動帶入已送出的歷史訂單明細至選單
        function showOrderDetails(order) {
            hasSubmittedOrder = true;
            currentOrder = order;
            
            if (order && order.shop_name) {
                document.getElementById('shopNameDisplay').textContent = `店家：${order.shop_name}`;
            }

            // 自動將歷史訂單品項載入購物車與數量選單中
            cart = {};
            if (order && order.items) {
                order.items.forEach(item => {
                    const itemName = item.item || item.name;
                    const itemPrice = parseInt(item.price || 0);
                    const itemQty = parseInt(item.quantity || 0);
                    if (itemName && itemQty > 0) {
                        cart[itemName] = {
                            price: itemPrice,
                            quantity: itemQty
                        };
                    }
                });
            }

            // 即時同步呈現選單數量與購物車明細
            updateCartDisplay();
        }
        
        function openCart() {
            document.getElementById('cartModal').classList.add('show');
        }
        
        function closeCart() {
            document.getElementById('cartModal').classList.remove('show');
        }
        
        async function submitOrder() {
            if (isSessionClosedGlobal) {
                alert('🔒 本次團購已結單，無法送出或修改訂單！');
                return;
            }
            if (Object.keys(cart).length === 0) {
                alert('購物車是空的，請選擇餐點');
                return;
            }
            
            const submitBtn = document.getElementById('submitOrderBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '📤 送出中...';
            
            try {
                const response = await fetch('/api/order', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        session_id: sessionIdGlobal,
                        group_id: groupIdGlobal,
                        user_id: userIdGlobal,
                        user_name: userNameGlobal,
                        shop_name: shopNameGlobal,
                        order_items: cart
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    alert(`✅ 訂單已${hasSubmittedOrder ? '更新' : '送出'}！\n你的小計: $${data.user_total}\n群組總計: $${data.group_total}\n已點餐人數: ${data.user_count}`);
                    
                    // 保存訂單
                    currentOrder = {
                        shop_name: shopNameGlobal,
                        items: Object.entries(cart).map(([name, item]) => ({
                            item: name,
                            price: item.price,
                            quantity: item.quantity,
                            subtotal: item.price * item.quantity
                        })),
                        total: Object.entries(cart).reduce((sum, [, item]) => sum + (item.price * item.quantity), 0)
                    };
                    
                    showOrderDetails(currentOrder);
                    closeCart();
                } else {
                    const errorData = await response.json();
                    alert('❌ 送出訂單失敗: ' + (errorData.error || '未知錯誤'));
                }
            } catch (error) {
                console.error('送出訂單錯誤:', error);
                alert('❌ 送出訂單失敗: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = hasSubmittedOrder ? '✏️ 修改訂單' : '📤 送出訂單';
            }
        }
        
        // 點擊左上角「好棒棒點餐」標題回到點餐/首頁介面
        async function goHomeOrderingView() {
            console.log('[Header Logo] 點擊回到點餐介面');
            
            // 1. 若購物車彈窗開啟中則先關閉
            closeCart();

            // 2. 若存在團購 Session，重新取得與呈現團購菜單
            if (sessionIdGlobal) {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('menuContent').style.display = 'none';
                document.getElementById('errorContent').style.display = 'none';

                try {
                    const response = await fetch('/api/recognize', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({session_id: sessionIdGlobal})
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.status === 'completed' && data.menu) {
                            displayMenu(data.menu);
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                            return;
                        }
                    }
                } catch (err) {
                    console.error('重新載入團購菜單錯誤:', err);
                }
            }

            // 3. 若有歷史載入過的點餐菜單，立刻開啟並回到頂部
            if (menuDataGlobal && menuDataGlobal.length > 0) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorContent').style.display = 'none';
                document.getElementById('menuContent').style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            // 4. 若當前已有選擇特定店家，切換至該店家點餐/編輯介面
            if (currentEditingShop) {
                selectShopToEdit(currentEditingShop);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            // 5. 若無任何紀錄，重新執行 initLiff
            initLiff();
        }
        
        // 檢查用戶是否已有訂單 (包含 session 綁定)
        async function checkExistingOrder() {
            try {
                if (!groupIdGlobal || !userIdGlobal) {
                    renderClosedStateUI();
                    return;
                }

                // 有 session_id → 只查當前 session，不撈舊資料
                if (sessionIdGlobal) {
                    const url = `/api/order/${groupIdGlobal}/${userIdGlobal}?session_id=${encodeURIComponent(sessionIdGlobal)}`;
                    const response = await fetch(url);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.status === 'found') {
                            // 此 session 本人已點過 → 帶入
                            showOrderDetails(data.order);
                            renderClosedStateUI();
                            return;
                        }
                    }
                    // 此 session 查無訂單 → 確保購物車乾淨
                    cart = {};
                    hasSubmittedOrder = false;
                    currentOrder = null;
                    updateCartDisplay();
                    renderClosedStateUI();
                    return;
                }

                // 無 session_id（舊版相容）
                const url = `/api/order/${groupIdGlobal}/${userIdGlobal}`;
                const response = await fetch(url);
                if (response.ok) {
                    const data = await response.json();
                    if (data.status === 'found') {
                        showOrderDetails(data.order);
                        renderClosedStateUI();
                        return;
                    }
                }
                hasSubmittedOrder = false;
                currentOrder = null;
                renderClosedStateUI();
            } catch (error) {
                console.error('檢查訂單錯誤:', error);
                renderClosedStateUI();
            }
        }

        // 渲染結單與訂單顯示 UI 狀態
        function renderClosedStateUI() {
            const closedBannerEl = document.getElementById('closedStatusBanner');
            const myOrderCardEl = document.getElementById('myOrderSummaryCard');

            if (!isSessionClosedGlobal) {
                if (closedBannerEl) closedBannerEl.style.display = 'none';
                if (myOrderCardEl) myOrderCardEl.style.display = 'none';
                document.querySelectorAll('.quantity-btn').forEach(btn => btn.disabled = false);
                return;
            }

            // 結單狀態：禁用選單點餐按鈕
            document.querySelectorAll('.quantity-btn').forEach(btn => btn.disabled = true);
            const submitBtn = document.getElementById('submitOrderBtn');

            if (hasSubmittedOrder && currentOrder) {
                // 已結單 + 有訂購餐點 -> 顯示自己訂購的餐點明細
                if (closedBannerEl) {
                    closedBannerEl.className = 'closed-banner success';
                    closedBannerEl.innerHTML = '🔒 本次團購已結單！以下是您訂購的餐點明細：';
                    closedBannerEl.style.display = 'block';
                }

                if (myOrderCardEl) {
                    let itemsHtml = '';
                    if (currentOrder.items && currentOrder.items.length > 0) {
                        currentOrder.items.forEach(item => {
                            const name = item.item || item.name;
                            itemsHtml += `<li class="my-order-item">
                                <span>${name} × ${item.quantity}</span>
                                <span style="font-weight: 600;">$${item.subtotal}</span>
                            </li>`;
                        });
                    }
                    myOrderCardEl.innerHTML = `
                        <div class="my-order-header">
                            <span style="font-size: 15px; font-weight: 700; color: #2d3748;">👤 您訂購的餐點明細</span>
                            <span id="orderCompletedBadge" style="font-size: 12px; color: #319795; font-weight: bold;">(已結單鎖定)</span>
                        </div>
                        <ul class="my-order-list">${itemsHtml}</ul>
                        <div class="my-order-total">
                            <span>總額：</span>
                            <span style="font-size: 18px; color: #e53e3e;">$${currentOrder.total || 0}</span>
                        </div>
                    `;
                    myOrderCardEl.style.display = 'block';

                    // 非同步確認此 session 是否已 完成 歸檔
                    if (sessionIdGlobal && userIdGlobal) {
                        startCompletedPolling();
                    }
                }

                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.textContent = '🔒 已結單無法修改訂單';
                }
            } else {
                // 已結單 + 沒點餐 -> 顯示 已結單無法點餐
                if (closedBannerEl) {
                    closedBannerEl.className = 'closed-banner danger';
                    closedBannerEl.innerHTML = `
                        <div style="font-size: 18px; font-weight: 700;">🔒 已結單無法點餐</div>
                        <div style="font-size: 13px; margin-top: 5px; color: #9b2c2c;">
                            本次團購已由發起人宣佈結單，目前無法新增或點選餐點。
                        </div>
                    `;
                    closedBannerEl.style.display = 'block';
                }
                if (myOrderCardEl) {
                    myOrderCardEl.style.display = 'none';
                }
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.textContent = '🔒 已結單無法點餐';
                }
            }
        }

        let sessionPollTimer = null;
        let completedPollTimer = null;

        // AJAX 輪詢檢查團購 Session 結單狀態，實現無需手動刷新頁面的實時自動更新
        function startSessionPolling() {
            if (!sessionIdGlobal) return;
            if (sessionPollTimer) clearInterval(sessionPollTimer);

            sessionPollTimer = setInterval(async () => {
                if (isSessionClosedGlobal) {
                    clearInterval(sessionPollTimer);
                    return;
                }
                try {
                    const res = await fetch(`/api/session-status/${encodeURIComponent(sessionIdGlobal)}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.is_closed) {
                            console.log('🔒 [AJAX] 偵測到已結單，無需重整，自動即時更新介面！');
                            isSessionClosedGlobal = true;
                            clearInterval(sessionPollTimer);
                            checkExistingOrder(); // 重新拉取並渲染最新結單 UI 狀態
                            startCompletedPolling(); // 結單後開始輪詢完成狀態
                        }
                    }
                } catch (err) {
                    console.error('輪詢 Session 狀態失敗:', err);
                }
            }, 3000); // 每 3 秒 Ajax 動態自動檢測一次
        }

        // AJAX 輪詢檢查團購完成狀態，結單後自動假測發起人是否發了 完成 指令
        function startCompletedPolling() {
            if (!sessionIdGlobal || !userIdGlobal) return;
            if (completedPollTimer) clearInterval(completedPollTimer);

            completedPollTimer = setInterval(async () => {
                try {
                    const res = await fetch(`/api/session-completed/${userIdGlobal}/${encodeURIComponent(sessionIdGlobal)}`);
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.completed) {
                        console.log('✅ [AJAX] 側測到團購已完成，更新徽章！');
                        clearInterval(completedPollTimer);
                        const badge = document.getElementById('orderCompletedBadge');
                        if (badge) {
                            badge.innerHTML = '<span class="badge-completed">✅ 已完成</span>';
                        }
                    }
                } catch (err) {
                    console.error('輪詢完成狀態失敗:', err);
                }
            }, 4000); // 每 4 秒檢查一次
        }
        
        function displayMenu(menuData) {
            document.getElementById('loading').style.display = 'none';
            
            if (!menuData) {
                document.getElementById('errorContent').style.display = 'block';
                document.getElementById('errorContent').innerHTML = (
                    '<div class="error">' +
                    'ℹ️ 未載入特定團購菜單數據<br>' +
                    '<small style="font-size:12px;color:#666;margin-top:6px;display:block;">' +
                    '• 您可以直接在<b>左側「我的店家庫」</b>點擊查看與編輯您的專屬菜單。<br>' +
                    '• 或於 LINE 聊天室輸入<b>「@機器人 團購 店家名稱」</b>重新發起團購喔！' +
                    '</small></div>'
                );
                return;
            }

            try {
                let items = menuData;
                console.log('[DEBUG] 初始 menuData:', menuData);
                
                if (typeof menuData === 'string') {
                    items = JSON.parse(menuData);
                }

                const shopName = items?.shop_name || items?.store_name || items?.店家名稱 || '';
                shopNameGlobal = shopName;
                const shopNameDisplay = document.getElementById('shopNameDisplay');
                shopNameDisplay.textContent = shopName ? `店家：${shopName}` : '';

                if (!Array.isArray(items)) {
                    items = items.menu_items || items.items || items.menu || [];
                    console.log('[DEBUG] 提取後的 items:', items);
                }

                if (!items || items.length === 0) {
                    document.getElementById('errorContent').style.display = 'block';
                    document.getElementById('errorContent').innerHTML = '<div class="error">❌ 菜單為空或無法識別</div>';
                    return;
                }

                // ✅ 開新團購 — 清空購物車、訂單狀態、結單狀態
                cart = {};
                hasSubmittedOrder = false;
                currentOrder = null;
                isSessionClosedGlobal = false;
                updateCartDisplay();

                // 隱藏上次殘留的結單 UI
                const closedBanner = document.getElementById('closedStatusBanner');
                const myOrderCard = document.getElementById('myOrderSummaryCard');
                if (closedBanner) closedBanner.style.display = 'none';
                if (myOrderCard) myOrderCard.style.display = 'none';
                // 重新啟用點餐按鈕
                document.querySelectorAll('.quantity-btn').forEach(btn => btn.disabled = false);

                menuDataGlobal = items;
                const menuList = document.getElementById('menuList');
                menuList.innerHTML = '';
                
                items.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = 'menu-item';
                    
                    const itemName = item.item_name || item.name || item.品項名稱 || '未知品項';
                    const itemPrice = parseInt(item.price || item.價格 || item.價錢 || 0);
                    const itemId = `qty-item-${index}`;
                    
                    li.innerHTML = `
                        <div class="menu-item-container">
                            <div class="menu-item-info">
                                <span class="item-name">${itemName}</span>
                                <span class="item-price">$${itemPrice}</span>
                            </div>
                            <div class="quantity-controls">
                                <button class="quantity-btn" data-item-name="${itemName}" data-delta="-1">−</button>
                                <span class="quantity-display" id="${itemId}" data-item-name="${itemName}">${cart[itemName]?.quantity || 0}</span>
                                <button class="quantity-btn" data-item-name="${itemName}" data-delta="1">+</button>
                            </div>
                        </div>
                    `;
                    menuList.appendChild(li);
                });

                document.getElementById('menuContent').style.display = 'block';
                document.getElementById('submitOrderBtn').onclick = submitOrder;
                
                // 檢查是否已有訂單
                checkExistingOrder();
                
                console.log('[SUCCESS] 菜單成功顯示，共 ' + items.length + ' 項');

            } catch (error) {
                console.error('菜單解析失敗:', error);
                document.getElementById('errorContent').style.display = 'block';
                document.getElementById('errorContent').innerHTML = `<div class="error">菜單數據格式錯誤: ${error.message}</div>`;
            }
        }

        // 頁面加載完成後初始化 LIFF
        async function initLiff() {
            try {
                console.log('[0] 獲取配置信息...');
                const configResponse = await fetch('/api/config');
                const config = await configResponse.json();
                const liffId = config.liffId;
                console.log('[0b] 獲得 LIFF ID:', liffId);
                
                console.log('[1] 檢查 LIFF SDK...');
                
                let liffObj = null;
                if (typeof window.liff !== 'undefined') {
                    liffObj = window.liff;
                    console.log('[1b] 從 window.liff 找到');
                } else if (typeof liff !== 'undefined') {
                    liffObj = liff;
                    console.log('[1c] 從全局 liff 找到');
                } else {
                    console.error('[ERROR] liff 對象不存在');
                    throw new Error('LIFF SDK 未在 LINE LIFF 環境中加載');
                }

                console.log('[2] 初始化 LIFF...');
                
                await liffObj.init({ liffId: liffId })
                    .then(() => {
                        console.log('[2b] LIFF 初始化成功');
                    })
                    .catch((err) => {
                        throw new Error(`LIFF init 失敗: ${err.message}`);
                    });
                
                console.log('[3] 檢查登入狀態...');
                if (!liffObj.isLoggedIn()) {
                    console.log('[4] 未登入，跳轉到登入...');
                    liffObj.login();
                    return;
                }

                console.log('[5] 獲取用户信息...');
                const profile = await liffObj.getProfile();
                console.log('[6] 獲得用户信息:', profile);
                
                userIdGlobal = profile.userId;
                
                // 設置用戶名：優先使用 displayName，如果為空則向後端查詢
                let displayName = profile.displayName;
                if (!displayName || displayName.trim() === '') {
                    // 從後端查詢 LINE 用戶的真實名稱
                    try {
                        const profileResponse = await fetch(`/api/user-profile/${profile.userId}`);
                        if (profileResponse.ok) {
                            const lineProfile = await profileResponse.json();
                            displayName = lineProfile.displayName || profile.userId;
                            console.log('[6b] 從後端取得名稱:', displayName);
                        } else {
                            displayName = profile.userId;
                        }
                    } catch (err) {
                        console.error('[6c] 查詢用戶名稱失敗:', err);
                        displayName = profile.userId;
                    }
                }
                userNameGlobal = displayName;  // 保存用戶名到全局變量
                document.getElementById('userName').textContent = displayName;
                document.getElementById('userAvatar').src = profile.pictureUrl;

                // 載入當前使用者的個人專屬店家庫
                loadUserShops(userIdGlobal);

                // 顯示歷史訂單按鈕
                document.getElementById('historyBtn').style.display = 'flex';

                console.log('[7] 獲取 session ID 和 group ID...');
                const urlParams = new URLSearchParams(window.location.search);
                const sessionId = urlParams.get('session');
                const groupId = urlParams.get('group');
                sessionIdGlobal = sessionId;
                groupIdGlobal = groupId;
                
                if (sessionId) {
                    console.log('[9] 開始辨識/載入菜單...');
                    startSessionPolling(); // 開啟 AJAX 輪詢自動偵測結單
                    try {
                        let retries = 0;
                        const maxRetries = 30; // 最高重試 30 秒
                        
                        while (retries < maxRetries) {
                            const response = await fetch('/api/recognize', {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({session_id: sessionId})
                            });
                            
                            if (response.ok) {
                                const data = await response.json();
                                console.log('[10] 辨識結果:', data);
                                
                                if (data.status === 'completed') {
                                    isSessionClosedGlobal = Boolean(data.is_closed);
                                    initiatorIdGlobal = data.initiator_id || '';
                                    displayMenu(data.menu);
                                    return;
                                }
                            } else if (response.status === 404) {
                                console.warn('[404] Session 不存在或已失效');
                                break; // 404 表示 Session 不存在，立刻跳出迴圈避免卡死在載入中！
                            }
                            
                            console.log(`[9.${retries}] 等待辨識... (${retries}s)`);
                            await new Promise(resolve => setTimeout(resolve, 1000));
                            retries++;
                        }
                        
                        console.error('[ERROR] 菜單辨識超時或 Session 失效');
                        displayMenu(null);
                    } catch (error) {
                        console.error('[13] 獲取菜單失敗:', error);
                        displayMenu(null);
                    }
                } else {
                    console.log('[14] 沒有 session ID');
                    displayMenu(null);
                }

            } catch (error) {
                console.error('❌ LIFF 初始化失敗:', error);
                alert("抓到錯誤了：" + error.message);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorContent').style.display = 'block';
                
                let errorMsg = error.message;
                if (error.message.includes('未在 LINE LIFF 環境')) {
                    errorMsg += '<br><br><strong>解決方案：</strong><br>1. 請確認通過 LINE 的 LIFF 按鈕打開此頁面<br>2. 檢查 LINE Developer Console 中 LIFF 的 Endpoint URL 設定<br>3. 確保 LIFF ID 正確';
                }
                
                document.getElementById('errorContent').innerHTML = `<div class="error">❌ LIFF 初始化失敗<br>${errorMsg}<br><small style="margin-top:10px;display:block">詳情見瀏覽器 F12 控制台</small></div>`;
            }
        }

        console.log('[START] 開始初始化...');
        
        document.getElementById('cartIconBtn').addEventListener('click', openCart);
        document.getElementById('cartCloseBtn').addEventListener('click', closeCart);
        
        document.getElementById('cartModal').addEventListener('click', (event) => {
            if (event.target.id === 'cartModal') {
                closeCart();
            }
        });
        
        document.getElementById('cartItemsList').addEventListener('click', (event) => {
            if (event.target.classList.contains('cart-item-remove')) {
                if (isSessionClosedGlobal) {
                    alert('🔒 本次團購已結單，無法移除購物車餐點');
                    return;
                }
                const itemName = event.target.getAttribute('data-item-name');
                removeFromCart(itemName);
            }
        });
        
        document.addEventListener('click', (event) => {
            if (event.target.classList.contains('quantity-btn') && event.target.getAttribute('data-item-name')) {
                const itemName = event.target.getAttribute('data-item-name');
                const delta = parseInt(event.target.getAttribute('data-delta'));
                updateQuantity(itemName, delta);
            }
        });
        
        // 載入當前使用者在 Firebase 中建立的所有專屬店家
        async function loadUserShops(userId) {
            const shopsListEl = document.getElementById('userShopsList');
            if (!userId) {
                shopsListEl.innerHTML = '<div class="no-shops-msg">未取得使用者資訊</div>';
                return;
            }
            try {
                console.log(`[API] 正在載入使用者 ${userId} 的個人店家...`);
                const response = await fetch(`/api/user-shops/${userId}`);
                console.log('[API] 載入個人店家 HTTP 回應狀態:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    const shops = data.shops || [];
                    if (shops.length === 0) {
                        shopsListEl.innerHTML = '<div class="no-shops-msg">尚未建立店家<br><span style="font-size:11px;color:#888;">長按圖片回覆：<br>「@機器人 上傳 店家名」<br>即可建立！</span></div>';
                    } else {
                        shopsListEl.innerHTML = '';
                        shops.forEach(shop => {
                            const div = document.createElement('div');
                            div.className = 'shop-card' + (currentEditingShop === shop.shop_name ? ' active' : '');
                            div.setAttribute('data-shop-name', shop.shop_name);
                            div.onclick = () => selectShopToEdit(shop.shop_name);
                            div.innerHTML = `
                                <span class="shop-card-name" title="${shop.shop_name}">🏪 ${shop.shop_name}</span>
                                <div style="display: flex; align-items: center; gap: 6px;">
                                    <span class="shop-card-count">${shop.item_count} 項</span>
                                    <button class="btn-delete-shop" onclick="deleteShop(event, '${shop.shop_name}')" title="刪除店家">✕</button>
                                </div>
                            `;
                            shopsListEl.appendChild(div);
                        });
                    }
                } else if (response.status === 404) {
                    shopsListEl.innerHTML = '<div class="no-shops-msg">請重新啟動後端伺服器<br><span style="font-size:11px;color:#888;">(重新載入 app.py 端點)</span></div>';
                } else {
                    shopsListEl.innerHTML = '<div class="no-shops-msg">載入店家失敗</div>';
                }
            } catch (error) {
                console.error('載入個人店家失敗:', error);
                shopsListEl.innerHTML = '<div class="no-shops-msg">載入錯誤</div>';
            }
        }

        // 刪除特定店家
        async function deleteShop(event, shopName) {
            event.stopPropagation();
            if (!confirm(`確定要刪除店家【${shopName}】及其菜單資料嗎？`)) {
                return;
            }
            try {
                const res = await fetch(`/api/user-shop/${userIdGlobal}/${encodeURIComponent(shopName)}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    alert(`✅ 店家【${shopName}】已成功刪除！`);
                    if (currentEditingShop === shopName) {
                        currentEditingShop = '';
                        document.getElementById('menuContent').style.display = 'none';
                    }
                    loadUserShops(userIdGlobal);
                } else {
                    alert('❌ 刪除店家失敗');
                }
            } catch (err) {
                console.error('刪除店家錯誤:', err);
                alert('❌ 刪除店家失敗');
            }
        }

        let currentEditingShop = '';

        // 點擊左側店家卡片進行編輯/檢視
        async function selectShopToEdit(shopName) {
            currentEditingShop = shopName;
            
            // 高亮選中的店家卡片
            document.querySelectorAll('.shop-card').forEach(card => {
                card.classList.remove('active');
                if (card.getAttribute('data-shop-name') === shopName) {
                    card.classList.add('active');
                }
            });

            document.getElementById('loading').style.display = 'block';
            document.getElementById('menuContent').style.display = 'none';
            document.getElementById('errorContent').style.display = 'none';

            try {
                const res = await fetch(`/api/user-shop-menu/${userIdGlobal}/${encodeURIComponent(shopName)}`);
                if (res.ok) {
                    const data = await res.json();
                    const menu = data.menu || {};
                    const items = menu.menu_items || menu.items || menu.menu || [];
                    renderShopEditor(shopName, items);
                } else {
                    alert('❌ 無法載入【' + shopName + '】的菜單內容');
                }
            } catch (err) {
                console.error('載入店家菜單錯誤:', err);
                alert('❌ 載入店家菜單失敗');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // 渲染店家菜單編輯介面
        function renderShopEditor(shopName, items) {
            shopNameGlobal = shopName;
            const shopNameDisplay = document.getElementById('shopNameDisplay');
            shopNameDisplay.innerHTML = `
                <div class="shop-edit-toolbar">
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="font-size: 14px; font-weight: 600;">🏪 店家名稱：</span>
                        <input type="text" id="editShopNameInput" class="edit-shop-name-title-input" value="${shopName}" placeholder="店家名稱">
                    </div>
                    <div class="edit-btn-group">
                        <button class="btn-sm btn-add" onclick="addEditItemRow()">➕ 新增品項</button>
                        <button class="btn-sm btn-save" onclick="saveCurrentShopMenu()">💾 儲存菜單</button>
                    </div>
                </div>
            `;

            const menuList = document.getElementById('menuList');
            menuList.innerHTML = '';

            if (items.length === 0) {
                addEditItemRow();
            } else {
                items.forEach(item => {
                    const itemName = item.item_name || item.name || '';
                    const itemPrice = parseInt(item.price || 0);
                    addEditItemRow(itemName, itemPrice);
                });
            }

            document.getElementById('menuContent').style.display = 'block';
        }

        // 動態新增編輯品項列
        function addEditItemRow(name = '', price = '') {
            const menuList = document.getElementById('menuList');
            const li = document.createElement('li');
            li.className = 'edit-item-row';
            li.innerHTML = `
                <input type="text" class="edit-input-name" placeholder="餐點/飲料名稱" value="${name}">
                <input type="number" class="edit-input-price" placeholder="價格" value="${price}">
                <button class="btn-delete-item" onclick="this.parentElement.remove()" title="刪除此項目">🗑️</button>
            `;
            menuList.appendChild(li);
        }

        // 儲存目前店家的菜單編輯結果 (動態取得最新目前編輯的舊店家名稱)
        async function saveCurrentShopMenu() {
            const oldShopName = currentEditingShop;
            const newShopNameInput = document.getElementById('editShopNameInput');
            const newShopName = newShopNameInput ? newShopNameInput.value.trim() : oldShopName;

            if (!newShopName) {
                alert('❌ 店家名稱不可為空！');
                return;
            }

            const rows = document.querySelectorAll('.edit-item-row');
            const updatedItems = [];

            rows.forEach(row => {
                const nameInput = row.querySelector('.edit-input-name');
                const priceInput = row.querySelector('.edit-input-price');
                const name = nameInput.value ? nameInput.value.trim() : '';
                const price = parseInt(priceInput.value || 0);

                if (name) {
                    updatedItems.push({
                        item_name: name,
                        price: price
                    });
                }
            });

            try {
                const res = await fetch('/api/user-shop-menu', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: userIdGlobal,
                        old_shop_name: oldShopName,
                        new_shop_name: newShopName,
                        menu_items: updatedItems
                    })
                });

                if (res.ok) {
                    alert(`✅ 店家【${newShopName}】菜單已成功儲存！(共 ${updatedItems.length} 項)`);
                    currentEditingShop = newShopName; // 關鍵修正：同步更新當前編輯名稱狀態
                    renderShopEditor(newShopName, updatedItems); // 重新渲染編輯區介面
                    loadUserShops(userIdGlobal); // 重新更新左側清單與計數
                } else {
                    const errData = await res.json();
                    alert('❌ 儲存失敗: ' + (errData.error || '未知錯誤'));
                }
            } catch (err) {
                console.error('儲存菜單錯誤:', err);
                alert('❌ 儲存菜單失敗');
            }
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                console.log('[DOMContentLoaded] 開始 initLiff()');
                initLiff();
            });
        } else {
            console.log('[Ready] 直接執行 initLiff()');
            initLiff();
        }
    </script>
       
</body>
</html>
