<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好棒棒點餐</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.2);
            padding: 8px 12px;
            border-radius: 20px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid white;
        }
        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .user-name {
            font-size: 14px;
            font-weight: 600;
        }
        .content {
            padding: 30px 20px;
        }
        .menu-section {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .menu-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .menu-list {
            list-style: none;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }
        .menu-item:last-child {
            border-bottom: none;
        }
        .item-name {
            font-weight: 500;
            color: #333;
        }
        .item-price {
            font-weight: 600;
            color: #06C755;
            font-size: 16px;
        }
        .json-preview {
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            margin-top: 20px;
            overflow-x: auto;
        }
        .json-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .json-code {
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            color: #333;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
            border: 1px solid #fcc;
        }
        .menu-item-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .menu-item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 4px 8px;
        }
        .quantity-btn {
            background: none;
            border: none;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
            font-weight: bold;
            transition: all 0.2s;
        }
        .quantity-btn:hover {
            background: #f0f0f0;
            border-radius: 4px;
        }
        .quantity-btn:disabled {
            color: #ccc;
            cursor: not-allowed;
        }
        .quantity-display {
            min-width: 30px;
            text-align: center;
            font-weight: 600;
            color: #333;
        }
        .cart-section {
            background: #f9f9f9;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }
        .cart-section.show {
            display: block;
        }
        .cart-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cart-items-list {
            list-style: none;
            margin-bottom: 15px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: white;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #eee;
        }
        .cart-item-info {
            flex: 1;
        }
        .cart-item-name {
            font-weight: 500;
            color: #333;
        }
        .cart-item-qty {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }
        .cart-item-price {
            font-weight: 600;
            color: #06C755;
            min-width: 60px;
            text-align: right;
        }
        .cart-item-remove {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
        }
        .cart-item-remove:hover {
            background: #ff5252;
        }
        .cart-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10px;
            background: #f5f5f5;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .cart-summary-label {
            font-weight: 600;
            color: #333;
        }
        .cart-summary-total {
            font-size: 20px;
            font-weight: 700;
            color: #06C755;
        }
        .submit-btn {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .empty-cart-msg {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
        .cart-icon-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }
        .cart-icon-btn:hover {
            transform: scale(1.1);
        }
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff6b6b;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 16px 16px 0 0;
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        .modal-close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        .modal-close-btn:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">🍔 好棒棒點餐</div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="cart-icon-btn" id="cartIconBtn">
                    🛒
                    <span class="cart-badge" id="cartBadge" style="display: none;">0</span>
                </button>
                <div class="user-info">
                    <div class="user-avatar">
                        <img id="userAvatar" src="" alt="用户頭像">
                    </div>
                    <div class="user-name" id="userName">加載中...</div>
                </div>
            </div>
        </div>
        <div class="content">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>辨識菜單中...</p>
            </div>
            <div id="menuContent" style="display: none;">
                <div class="menu-section">
                    <div class="menu-title">📋 菜單</div>
                    <ul class="menu-list" id="menuList">
                    </ul>
                </div>
            </div>
            
            <!-- 購物車 Modal -->
            <div class="modal-overlay" id="cartModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <div class="modal-title">🛒 購物車</div>
                        <button class="modal-close-btn" id="cartCloseBtn">✕</button>
                    </div>
                    <ul class="cart-items-list" id="cartItemsList"></ul>
                    <div class="empty-cart-msg" id="emptyCartMsg">購物車是空的，請選擇餐點</div>
                    <div id="cartSummaryDiv" style="display: none;">
                        <div class="cart-summary">
                            <span class="cart-summary-label">總計：</span>
                            <span class="cart-summary-total" id="cartTotal">$0</span>
                        </div>
                        <button class="submit-btn" id="submitOrderBtn">📤 送出訂單</button>
                    </div>
                </div>
            </div>
            <div id="errorContent" style="display: none;">
            </div>
        </div>
    </div>

    <script>
        // 購物車數據儲存
        let cart = {};
        let menuDataGlobal = [];
        let userIdGlobal = '';
        let userNameGlobal = '';  // LINE 用戶名
        let groupIdGlobal = '';
        let sessionIdGlobal = '';
        let hasSubmittedOrder = false;  // 是否已送出訂單
        let currentOrder = null;  // 當前訂單
        
        function addToCart(itemName, itemPrice) {
            if (cart[itemName]) {
                cart[itemName].quantity++;
            } else {
                cart[itemName] = {
                    price: itemPrice,
                    quantity: 1
                };
            }
            updateCartDisplay();
        }
        
        function removeFromCart(itemName) {
            delete cart[itemName];
            updateCartDisplay();
        }
        
        function updateQuantity(itemName, delta) {
            if (!cart[itemName]) {
                const itemPrice = menuDataGlobal.find(item => {
                    const name = item.item_name || item.name || item.品項名稱;
                    return name === itemName;
                })?.price || 0;
                
                if (delta > 0) {
                    cart[itemName] = {
                        price: itemPrice,
                        quantity: delta
                    };
                }
            } else {
                cart[itemName].quantity += delta;
                if (cart[itemName].quantity <= 0) {
                    delete cart[itemName];
                }
            }
            updateCartDisplay();
        }
        
        function updateCartDisplay() {
            const cartItemsList = document.getElementById('cartItemsList');
            const emptyCartMsg = document.getElementById('emptyCartMsg');
            const cartSummaryDiv = document.getElementById('cartSummaryDiv');
            const cartBadge = document.getElementById('cartBadge');
            
            const qtyElements = document.querySelectorAll('.quantity-display');
            qtyElements.forEach(element => {
                const itemName = element.getAttribute('data-item-name');
                element.textContent = cart[itemName]?.quantity || 0;
            });
            
            cartItemsList.innerHTML = '';
            let total = 0;
            let itemCount = 0;
            
            for (const [itemName, itemData] of Object.entries(cart)) {
                itemCount++;
                const subtotal = itemData.price * itemData.quantity;
                total += subtotal;
                
                const li = document.createElement('li');
                li.className = 'cart-item';
                li.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-name">${itemName}</div>
                        <div class="cart-item-qty">$${itemData.price} × ${itemData.quantity}</div>
                    </div>
                    <div class="cart-item-price">$${subtotal}</div>
                    <button class="cart-item-remove" data-item-name="${itemName}">移除</button>
                `;
                cartItemsList.appendChild(li);
            }
            
            if (itemCount === 0) {
                emptyCartMsg.style.display = 'block';
                cartSummaryDiv.style.display = 'none';
                cartBadge.style.display = 'none';
            } else {
                emptyCartMsg.style.display = 'none';
                cartSummaryDiv.style.display = 'block';
                document.getElementById('cartTotal').textContent = '$' + total;
                cartBadge.textContent = itemCount;
                cartBadge.style.display = 'flex';
            }
        }
        
        // 顯示訂單明細
        function showOrderDetails(order) {
            hasSubmittedOrder = true;
            currentOrder = order;
            
            const modal = document.getElementById('cartModal');
            const cartItemsList = document.getElementById('cartItemsList');
            const emptyCartMsg = document.getElementById('emptyCartMsg');
            const cartSummaryDiv = document.getElementById('cartSummaryDiv');
            const submitBtn = document.getElementById('submitOrderBtn');
            
            // 清除購物車顯示
            cartItemsList.innerHTML = '';
            
            // 顯示訂單明細
            order.items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'cart-item';
                li.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.item}</div>
                        <div class="cart-item-qty">$${item.price} × ${item.quantity}</div>
                    </div>
                    <div class="cart-item-price">$${item.subtotal}</div>
                `;
                cartItemsList.appendChild(li);
            });
            
            emptyCartMsg.style.display = 'none';
            cartSummaryDiv.style.display = 'block';
            document.getElementById('cartTotal').textContent = '$' + order.total;
            
            // 改為「修改訂單」按鈕
            submitBtn.textContent = '✏️ 修改訂單';
            submitBtn.onclick = startEditOrder;
        }
        
        // 開始編輯訂單
        function startEditOrder() {
            const submitBtn = document.getElementById('submitOrderBtn');
            
            // 加載購物車為原訂單內容
            cart = {};
            currentOrder.items.forEach(item => {
                cart[item.item] = {
                    price: item.price,
                    quantity: item.quantity
                };
            });
            
            updateCartDisplay();
            
            // 改為「更新訂單」按鈕
            submitBtn.textContent = '📤 更新訂單';
            submitBtn.onclick = submitOrder;
            
            alert('已加載訂單明細，您可以修改後重新送出');
        }
        
        function openCart() {
            document.getElementById('cartModal').classList.add('show');
        }
        
        function closeCart() {
            document.getElementById('cartModal').classList.remove('show');
        }
        
        async function submitOrder() {
            if (Object.keys(cart).length === 0) {
                alert('購物車是空的，請選擇餐點');
                return;
            }
            
            const submitBtn = document.getElementById('submitOrderBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '📤 送出中...';
            
            try {
                const response = await fetch('/api/order', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        group_id: groupIdGlobal,
                        user_id: userIdGlobal,
                        user_name: userNameGlobal,
                        order_items: cart
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    alert(`✅ 訂單已${hasSubmittedOrder ? '更新' : '送出'}！\n你的小計: $${data.user_total}\n群組總計: $${data.group_total}\n已點餐人數: ${data.user_count}`);
                    
                    // 保存訂單
                    currentOrder = {
                        items: Object.entries(cart).map(([name, item]) => ({
                            item: name,
                            price: item.price,
                            quantity: item.quantity,
                            subtotal: item.price * item.quantity
                        })),
                        total: Object.entries(cart).reduce((sum, [, item]) => sum + (item.price * item.quantity), 0)
                    };
                    
                    showOrderDetails(currentOrder);
                    closeCart();
                } else {
                    const errorData = await response.json();
                    alert('❌ 送出訂單失敗: ' + (errorData.error || '未知錯誤'));
                }
            } catch (error) {
                console.error('送出訂單錯誤:', error);
                alert('❌ 送出訂單失敗: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = hasSubmittedOrder ? '✏️ 修改訂單' : '📤 送出訂單';
            }
        }
        
        // 檢查用戶是否已有訂單
        async function checkExistingOrder() {
            try {
                const response = await fetch(`/api/order/${groupIdGlobal}/${userIdGlobal}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.status === 'found') {
                        showOrderDetails(data.order);
                    }
                }
            } catch (error) {
                console.error('檢查訂單錯誤:', error);
            }
        }
        
        function displayMenu(menuData) {
            document.getElementById('loading').style.display = 'none';
            
            if (!menuData) {
                document.getElementById('errorContent').style.display = 'block';
                document.getElementById('errorContent').innerHTML = '<div class="error">❌ 未找到菜單數據</div>';
                return;
            }

            try {
                let items = menuData;
                console.log('[DEBUG] 初始 menuData:', menuData);
                
                if (typeof menuData === 'string') {
                    items = JSON.parse(menuData);
                }

                if (!Array.isArray(items)) {
                    items = items.menu_items || items.items || items.menu || [];
                    console.log('[DEBUG] 提取後的 items:', items);
                }

                if (!items || items.length === 0) {
                    document.getElementById('errorContent').style.display = 'block';
                    document.getElementById('errorContent').innerHTML = '<div class="error">❌ 菜單為空或無法識別</div>';
                    return;
                }

                menuDataGlobal = items;
                const menuList = document.getElementById('menuList');
                menuList.innerHTML = '';
                
                items.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = 'menu-item';
                    
                    const itemName = item.item_name || item.name || item.品項名稱 || '未知品項';
                    const itemPrice = parseInt(item.price || item.價格 || item.價錢 || 0);
                    const itemId = `qty-item-${index}`;
                    
                    li.innerHTML = `
                        <div class="menu-item-container">
                            <div class="menu-item-info">
                                <span class="item-name">${itemName}</span>
                                <span class="item-price">$${itemPrice}</span>
                            </div>
                            <div class="quantity-controls">
                                <button class="quantity-btn" data-item-name="${itemName}" data-delta="-1">−</button>
                                <span class="quantity-display" id="${itemId}" data-item-name="${itemName}">${cart[itemName]?.quantity || 0}</span>
                                <button class="quantity-btn" data-item-name="${itemName}" data-delta="1">+</button>
                            </div>
                        </div>
                    `;
                    menuList.appendChild(li);
                });

                document.getElementById('menuContent').style.display = 'block';
                document.getElementById('submitOrderBtn').onclick = submitOrder;
                
                // 檢查是否已有訂單
                checkExistingOrder();
                
                console.log('[SUCCESS] 菜單成功顯示，共 ' + items.length + ' 項');

            } catch (error) {
                console.error('菜單解析失敗:', error);
                document.getElementById('errorContent').style.display = 'block';
                document.getElementById('errorContent').innerHTML = `<div class="error">菜單數據格式錯誤: ${error.message}</div>`;
            }
        }

        // 頁面加載完成後初始化 LIFF
        async function initLiff() {
            try {
                console.log('[0] 獲取配置信息...');
                const configResponse = await fetch('/api/config');
                const config = await configResponse.json();
                const liffId = config.liffId;
                console.log('[0b] 獲得 LIFF ID:', liffId);
                
                console.log('[1] 檢查 LIFF SDK...');
                
                let liffObj = null;
                if (typeof window.liff !== 'undefined') {
                    liffObj = window.liff;
                    console.log('[1b] 從 window.liff 找到');
                } else if (typeof liff !== 'undefined') {
                    liffObj = liff;
                    console.log('[1c] 從全局 liff 找到');
                } else {
                    console.error('[ERROR] liff 對象不存在');
                    throw new Error('LIFF SDK 未在 LINE LIFF 環境中加載');
                }

                console.log('[2] 初始化 LIFF...');
                
                await liffObj.init({ liffId: liffId })
                    .then(() => {
                        console.log('[2b] LIFF 初始化成功');
                    })
                    .catch((err) => {
                        throw new Error(`LIFF init 失敗: ${err.message}`);
                    });
                
                console.log('[3] 檢查登入狀態...');
                if (!liffObj.isLoggedIn()) {
                    console.log('[4] 未登入，跳轉到登入...');
                    liffObj.login();
                    return;
                }

                console.log('[5] 獲取用户信息...');
                const profile = await liffObj.getProfile();
                console.log('[6] 獲得用户信息:', profile);
                
                userIdGlobal = profile.userId;
                
                // 設置用戶名：優先使用 displayName，如果為空則向後端查詢
                let displayName = profile.displayName;
                if (!displayName || displayName.trim() === '') {
                    // 從後端查詢 LINE 用戶的真實名稱
                    try {
                        const profileResponse = await fetch(`/api/user-profile/${profile.userId}`);
                        if (profileResponse.ok) {
                            const lineProfile = await profileResponse.json();
                            displayName = lineProfile.displayName || profile.userId;
                            console.log('[6b] 從後端取得名稱:', displayName);
                        } else {
                            displayName = profile.userId;
                        }
                    } catch (err) {
                        console.error('[6c] 查詢用戶名稱失敗:', err);
                        displayName = profile.userId;
                    }
                }
                userNameGlobal = displayName;  // 保存用戶名到全局變量
                document.getElementById('userName').textContent = displayName;
                document.getElementById('userAvatar').src = profile.pictureUrl;

                console.log('[7] 獲取 session ID 和 group ID...');
                const urlParams = new URLSearchParams(window.location.search);
                const sessionId = urlParams.get('session');
                const groupId = urlParams.get('group');
                sessionIdGlobal = sessionId;
                groupIdGlobal = groupId;
                
                if (sessionId) {
                    console.log('[9] 開始辨識菜單...');
                    try {
                        let retries = 0;
                        const maxRetries = 120;
                        
                        while (retries < maxRetries) {
                            const response = await fetch('/api/recognize', {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({session_id: sessionId})
                            });
                            
                            if (response.ok) {
                                const data = await response.json();
                                console.log('[10] 辨識結果:', data);
                                
                                if (data.status === 'completed') {
                                    displayMenu(data.menu);
                                    return;
                                }
                            }
                            
                            console.log(`[9.${retries}] 等待辨識... (${retries}s)`);
                            await new Promise(resolve => setTimeout(resolve, 1000));
                            retries++;
                        }
                        
                        console.error('[ERROR] 菜單辨識超時');
                        displayMenu(null);
                    } catch (error) {
                        console.error('[13] 獲取菜單失敗:', error);
                        displayMenu(null);
                    }
                } else {
                    console.log('[14] 沒有 session ID');
                    displayMenu(null);
                }

            } catch (error) {
                console.error('❌ LIFF 初始化失敗:', error);
                alert("抓到錯誤了：" + error.message);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('errorContent').style.display = 'block';
                
                let errorMsg = error.message;
                if (error.message.includes('未在 LINE LIFF 環境')) {
                    errorMsg += '<br><br><strong>解決方案：</strong><br>1. 請確認通過 LINE 的 LIFF 按鈕打開此頁面<br>2. 檢查 LINE Developer Console 中 LIFF 的 Endpoint URL 設定<br>3. 確保 LIFF ID 正確';
                }
                
                document.getElementById('errorContent').innerHTML = `<div class="error">❌ LIFF 初始化失敗<br>${errorMsg}<br><small style="margin-top:10px;display:block">詳情見瀏覽器 F12 控制台</small></div>`;
            }
        }

        console.log('[START] 開始初始化...');
        
        document.getElementById('cartIconBtn').addEventListener('click', openCart);
        document.getElementById('cartCloseBtn').addEventListener('click', closeCart);
        
        document.getElementById('cartModal').addEventListener('click', (event) => {
            if (event.target.id === 'cartModal') {
                closeCart();
            }
        });
        
        document.getElementById('cartItemsList').addEventListener('click', (event) => {
            if (event.target.classList.contains('cart-item-remove')) {
                const itemName = event.target.getAttribute('data-item-name');
                removeFromCart(itemName);
            }
        });
        
        document.addEventListener('click', (event) => {
            if (event.target.classList.contains('quantity-btn') && event.target.getAttribute('data-item-name')) {
                const itemName = event.target.getAttribute('data-item-name');
                const delta = parseInt(event.target.getAttribute('data-delta'));
                updateQuantity(itemName, delta);
            }
        });
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                console.log('[DOMContentLoaded] 開始 initLiff()');
                initLiff();
            });
        } else {
            console.log('[Ready] 直接執行 initLiff()');
            initLiff();
        }
    </script>
       
</body>
</html>
